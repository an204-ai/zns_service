services:
  postgres:
    image: postgres:16-alpine
    container_name: zns_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zns_reseller}
      POSTGRES_USER: ${POSTGRES_USER:-zns_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zns_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zns_user} -d ${POSTGRES_DB:-zns_reseller}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache_redis:
    image: redis:7-alpine
    container_name: zns_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  broker_rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: zns_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-zns_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-zns_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zns_backend
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://zns_user:zns_password@postgres:5432/zns_reseller?schema=public}
      REDIS_HOST: cache_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://zns_user:zns_password@broker_rabbitmq:5672}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-zns_secret_access_key_jwt_super_secure_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-zns_secret_refresh_key_jwt_super_secure_2026}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FPT_ZBS_BASE_URL: ${FPT_ZBS_BASE_URL:-https://api-zbs.fpt.work}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-zns_reseller_aes256_secret_key_32}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-30}
    depends_on:
      postgres:
        condition: service_healthy
      cache_redis:
        condition: service_healthy
      broker_rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
    container_name: zns_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
