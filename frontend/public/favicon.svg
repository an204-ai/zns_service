<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient nền màu xanh Zalo chuẩn doanh nghiệp (không dùng tím) -->
    <linearGradient id="znsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0068FF"/>
      <stop offset="100%" stop-color="#004cd0"/>
    </linearGradient>
    <!-- Đổ bóng nhẹ cho khung chat -->
    <filter id="bubbleShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#002b7a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Nền Squircle bo góc hiện đại -->
  <rect width="64" height="64" rx="16" fill="url(#znsBgGrad)"/>

  <!-- Viền sáng nhẹ tạo chiều sâu cao cấp -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Biểu tượng tin nhắn Zalo Notification Service -->
  <g filter="url(#bubbleShadow)">
    <!-- Khung bong bóng chat màu trắng tinh tế -->
    <path d="M15 20C15 15.58 18.58 12 23 12H41C45.42 12 49 15.58 49 20V35C49 39.42 45.42 43 41 43H26L18 49V43C16.34 43 15 41.66 15 40V20Z" fill="#FFFFFF"/>
    
    <!-- Chữ Z đặc trưng của thương hiệu Zalo / ZNS -->
    <path d="M23.5 21H39.5C40.05 21 40.5 21.45 40.5 22V24.2C40.5 24.6 40.3 24.95 39.95 25.2L30.2 32.8H40C40.55 32.8 41 33.25 41 33.8V36C41 36.55 40.55 37 40 37H24C23.45 37 23 36.55 23 36V33.8C23 33.4 23.2 33.05 23.55 32.8L33.3 25.2H23.5C22.95 25.2 22.5 24.75 22.5 24.2V22C22.5 21.45 22.95 21 23.5 21Z" fill="#0068FF"/>
  </g>

  <!-- Chấm tín hiệu thông báo thời gian thực (ZNS Live Notification) -->
  <circle cx="49" cy="14" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
</svg>